<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page not found</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; color: #333; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); max-width: 420px; text-align: center; }
    h1 { font-size: 48px; margin: 0 0 8px; color: #999; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>The page you are looking for doesn't exist or has been moved.</p>
  </div>
</body>
</html>
